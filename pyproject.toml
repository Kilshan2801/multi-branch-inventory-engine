[project]
name = "multi-branch-inventory-engine"
version = "1.0.0"
description = "Multi-branch inventory reservation and order processing engine (FastAPI + PostgreSQL)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI's Depends()/Query() in defaults is the intended style
    "UP017",  # datetime.UTC vs timezone.utc: either is fine
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Alembic; keep them as generated.
"alembic/versions/*" = ["UP", "E501"]
